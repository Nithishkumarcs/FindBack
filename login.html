<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — FindBack Lost & Found Network</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container navbar-container"></div>
  </nav>

  <div class="page-wrapper d-flex align-center justify-center">
    <div class="container container-narrow" style="max-width: 460px;">
      <div class="card" style="box-shadow: var(--shadow-lg);">
        <div class="card-body" style="padding: 2.25rem;">
          <div class="text-center" style="margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.3rem;">
              <i class="fa-solid fa-location-crosshairs"></i>
            </div>
            <h2 style="font-size: 1.6rem; margin-bottom: 0.35rem;">Welcome Back</h2>
            <p class="text-sm">Sign in to report, track claims, or manage reports</p>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <div style="position: relative;">
                <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autofocus />
              </div>
            </div>

            <div class="form-group">
              <div class="d-flex justify-between align-center" style="margin-bottom: 0.45rem;">
                <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
              </div>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.75rem;">
              Sign In
            </button>
          </form>

          <!-- Quick Fill Demo Accounts -->
          <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
            <div class="text-xs text-muted" style="text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.6rem; text-align: center;">
              Quick Demo Fill
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;" onclick="fillCredentials('sarah.jenkins@example.com', 'User@123456')">
                <i class="fa-solid fa-user"></i> Demo User
              </button>
              <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 0.75rem;" onclick="fillCredentials('admin@findback.org', 'Admin@123456')">
                <i class="fa-solid fa-shield-halved"></i> Demo Admin
              </button>
            </div>
          </div>

          <div class="text-center text-sm" style="margin-top: 1.5rem; color: var(--text-muted);">
            Don't have an account? <a href="register.html" style="font-weight: 600;">Create Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillCredentials(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }
  </script>
</body>
</html>
