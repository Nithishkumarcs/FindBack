<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claims & Disputes — FindBack Admin</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container navbar-container"></div>
  </nav>

  <div class="page-wrapper">
    <div class="container container-wide">

      <!-- Admin Header -->
      <div style="margin-bottom: 1.5rem;">
        <div class="d-flex align-center gap-2" style="margin-bottom: 0.5rem;">
          <span class="badge badge-sensitive"><i class="fa-solid fa-shield-halved"></i> Administrator Console</span>
          <span class="text-xs text-muted">Claims Oversight & Dispute Resolution</span>
        </div>
        <h1 style="font-size: 2.2rem; margin-bottom: 1rem;">Claims & Recovery Verification Oversight</h1>

        <div class="admin-nav">
          <a href="index.html" class="admin-nav-item"><i class="fa-solid fa-chart-line"></i> Overview & Analytics</a>
          <a href="users.html" class="admin-nav-item"><i class="fa-solid fa-users"></i> Users Management</a>
          <a href="reports.html" class="admin-nav-item"><i class="fa-solid fa-boxes-stacked"></i> Reports Moderation</a>
          <a href="claims.html" class="admin-nav-item active"><i class="fa-solid fa-clipboard-check"></i> Claims & Disputes</a>
          <a href="audit-logs.html" class="admin-nav-item"><i class="fa-solid fa-shield-cat"></i> Audit Logs</a>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table" id="admin-claims-table">
          <thead>
            <tr>
              <th>Claim ID</th>
              <th>Item / Case</th>
              <th>Claimant</th>
              <th>Finder</th>
              <th>Status</th>
              <th>Handover Spot</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="8" class="text-center text-muted" style="padding: 2rem;">Loading claims across network...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/matching.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/claims.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tableBody = document.querySelector('#admin-claims-table tbody');
      if (!tableBody) return;

      try {
        const res = await apiFetch('/admin/claims');
        const claims = res.claims || [];

        if (claims.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted" style="padding: 2rem;">No claims registered.</td></tr>`;
          return;
        }

        tableBody.innerHTML = claims.map(c => `
          <tr>
            <td><b>#${c.id}</b></td>
            <td>
              <div style="font-weight: 600;">${c.item_name}</div>
              <div style="font-family: monospace; font-size: 0.75rem; color: var(--text-dim);">${c.case_id}</div>
            </td>
            <td>${c.claimant_name}</td>
            <td>${c.finder_name}</td>
            <td>${getStatusBadge(c.status)}</td>
            <td style="font-size: 0.85rem;">${c.handover_location || '<span class="text-dim">Not scheduled</span>'}</td>
            <td style="font-size: 0.8rem; color: var(--text-dim);">${new Date(c.created_at).toLocaleDateString()}</td>
            <td>
              <div class="d-flex gap-1">
                ${c.status !== 'COMPLETED' ? `
                  <button class="btn btn-success btn-sm" onclick="adminForceApprove(${c.id})"><i class="fa-solid fa-check"></i></button>
                  <button class="btn btn-danger btn-sm" onclick="adminForceReject(${c.id})"><i class="fa-solid fa-xmark"></i></button>
                ` : '<span class="badge badge-recovered">Done</span>'}
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="8" class="text-center text-muted" style="padding: 2rem;">Failed to load claims.</td></tr>`;
      }
    });

    async function adminForceApprove(claimId) {
      if (!confirm('Approve this ownership claim as an administrator?')) return;
      try {
        await apiFetch(`/claims/${claimId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'APPROVED', review_notes: 'Approved via Administrator Resolution.' })
        });
        showToast('Claim approved.', 'success');
        window.location.reload();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function adminForceReject(claimId) {
      if (!confirm('Reject this ownership claim as an administrator?')) return;
      try {
        await apiFetch(`/claims/${claimId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'REJECTED', review_notes: 'Rejected via Administrator Resolution.' })
        });
        showToast('Claim rejected.', 'success');
        window.location.reload();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }
  </script>
</body>
</html>
