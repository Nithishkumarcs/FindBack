<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — FindBack</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="container navbar-container"></div>
  </nav>

  <div class="page-wrapper">
    <div class="container container-narrow">

      <!-- Profile Header -->
      <div class="card" style="margin-bottom: 2rem;">
        <div class="card-body" style="padding: 2rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
          <div class="user-avatar" style="width: 70px; height: 70px; font-size: 1.75rem;" id="prof-avatar">U</div>
          <div style="flex: 1;">
            <div class="d-flex align-center gap-2">
              <h2 style="font-size: 1.6rem;" id="prof-name">Loading...</h2>
              <span class="badge badge-found" id="prof-role">USER</span>
            </div>
            <p class="text-sm" id="prof-email">user@example.com</p>
            <div class="text-xs text-muted" style="margin-top: 0.35rem;" id="prof-created">Member since Sept 2026</div>
          </div>
        </div>
      </div>

      <!-- Profile Forms Grid -->
      <div class="grid-2">
        <!-- Edit Profile Info -->
        <div class="card">
          <div class="card-header">
            <h3 style="font-size: 1.05rem;"><i class="fa-regular fa-user"></i> Personal Information</h3>
          </div>
          <div class="card-body">
            <form id="profile-edit-form">
              <div class="form-group">
                <label class="form-label" for="edit-name">Full Name</label>
                <input type="text" id="edit-name" class="form-control" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-phone">Phone Number</label>
                <input type="tel" id="edit-phone" class="form-control" />
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-location">Campus / Community Area</label>
                <input type="text" id="edit-location" class="form-control" />
              </div>

              <button type="submit" class="btn btn-primary" style="width: 100%;">Save Changes</button>
            </form>
          </div>
        </div>

        <!-- Change Password -->
        <div class="card">
          <div class="card-header">
            <h3 style="font-size: 1.05rem;"><i class="fa-solid fa-lock"></i> Security & Password</h3>
          </div>
          <div class="card-body">
            <form id="password-change-form">
              <div class="form-group">
                <label class="form-label" for="old-password">Current Password</label>
                <input type="password" id="old-password" class="form-control" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="new-password">New Password</label>
                <input type="password" id="new-password" class="form-control" placeholder="Min. 8 chars (letters & numbers)" required minlength="8" />
              </div>

              <div class="form-group">
                <label class="form-label" for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password" class="form-control" required />
              </div>

              <button type="submit" class="btn btn-secondary" style="width: 100%;">Update Password</button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'login.html?redirect=profile.html';
        return;
      }

      try {
        const res = await apiFetch('/auth/me');
        const user = res.user;

        document.getElementById('prof-name').innerText = user.name;
        document.getElementById('prof-email').innerText = user.email;
        document.getElementById('prof-role').innerText = user.role;
        document.getElementById('prof-created').innerText = `Member since ${new Date(user.created_at).toLocaleDateString()}`;

        const initials = user.name ? user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'U';
        document.getElementById('prof-avatar').innerText = initials;

        document.getElementById('edit-name').value = user.name || '';
        document.getElementById('edit-phone').value = user.phone || '';
        document.getElementById('edit-location').value = user.general_location || '';
      } catch (err) {
        showToast('Failed to load profile.', 'error');
      }

      // Handle profile update
      document.getElementById('profile-edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('edit-name').value.trim();
        const phone = document.getElementById('edit-phone').value.trim();
        const general_location = document.getElementById('edit-location').value.trim();

        try {
          const res = await apiFetch('/auth/profile', {
            method: 'PUT',
            body: JSON.stringify({ name, phone, general_location })
          });
          Auth.setUser(res.user);
          showToast(res.message, 'success');
          renderNavbar();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      // Handle password update
      document.getElementById('password-change-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const old_password = document.getElementById('old-password').value;
        const new_password = document.getElementById('new-password').value;
        const confirm_new = document.getElementById('confirm-new-password').value;

        if (new_password !== confirm_new) {
          showToast('New passwords do not match.', 'error');
          return;
        }

        try {
          const res = await apiFetch('/auth/profile', {
            method: 'PUT',
            body: JSON.stringify({ old_password, new_password })
          });
          showToast('Password updated successfully.', 'success');
          document.getElementById('password-change-form').reset();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
